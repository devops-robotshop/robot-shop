# ==========================================
# 1. KEDA AI-DRIVEN SCALER (CHO WEB)
# ==========================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: web-scaler-ai
  namespace: production 
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 60      # Chờ 60s an toàn mới thu hồi Pod
  pollingInterval: 10     # Cứ 10s hỏi thăm bảng tin 1 lần
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      metricName: ai_predicted_anomaly
      threshold: "1"      # Cứ AI phán bằng 1 là tự đẻ Pod
      query: max(ai_predicted_anomaly)

---
# ==========================================
# 2. KEDA RABBITMQ SCALER (CẤU HÌNH ĐÚNG)
# ==========================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dispatch-scaler
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dispatch
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp               
      mode: QueueLength
      value: "20"                  
      queueName: orders            
      host: amqp://guest:guest@rabbitmq.production.svc.cluster.local:5672